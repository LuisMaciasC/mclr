# Cloudflare Workers (plan gratuito). Secretos: se cargan con `wrangler secret put`, nunca en este archivo.
#   wrangler secret put ODOO_API_KEY
#   wrangler secret put TOKEN_SECRET
#   wrangler secret put ODOO_LOGIN      (correo del usuario de integración)
name = "app-campo-puente"
main = "src/index.ts"
compatibility_date = "2025-05-01"

[vars]
ODOO_URL = "https://bering.odoo.com"
ODOO_DB = "bering"
PBKDF2_ITER = "20000"
SESION_HORAS = "12"

# Limitador de peticiones gratuito de Workers: 10 intentos de inicio de sesión por minuto por IP.
[[unsafe.bindings]]
name = "LIMITE_SESION"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
